name: deploy-sandbox

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege for sandbox deployment: Cloudflare credentials arrive only
# through repository secrets and are never printed or committed. This workflow
# must never target production (ADR-0008, ticket #14); production promotion is
# the explicit manual `.github/workflows/promote-production.yml` workflow.
#
# Target-aware deploys (ticket #78): this workflow invokes the same repository
# deploy boundary as a local operator (`npm run deploy`) for the configured
# sandbox target instead of duplicating Worker/D1 resource naming. Canonical
# Worker/D1 names derive from `<company>-<site>-<service>-<environment>` in
# `deploy/targets.json`; the deployer materializes a temporary Wrangler
# config, runs preflight, applies D1 migrations before Worker deployment,
# records the deployment and runs the smoke test.
permissions:
  contents: read

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the configured sandbox target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to the RCH sandbox target
        env:
          SMOKE_SANDBOX_BASE_URL: ${{ secrets.SANDBOX_BASE_URL }}
          SMOKE_SANDBOX_EMAIL_DOMAIN: ${{ secrets.SANDBOX_SMOKE_EMAIL_DOMAIN }}
        run: npm run deploy -- --target rch-rugbychampagne --env sandbox --non-interactive
