name: deploy-sandbox

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege for sandbox deployment: Cloudflare credentials arrive only
# through repository secrets and are never printed or committed. This workflow
# must never target production (ADR-0008, ticket #14); production promotion is
# the explicit manual `.github/workflows/promote-production.yml` workflow.
permissions:
  contents: read

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    name: migrate and deploy sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate D1 migrations against local D1
        run: npx wrangler d1 migrations apply DB --local

      - name: Apply D1 migrations to sandbox
        run: npx wrangler d1 migrations apply DB --env sandbox --remote

      - name: Deploy Worker to sandbox
        run: npx wrangler deploy --env sandbox

      - name: Record sandbox deployment
        run: npx wrangler deployments list --env sandbox

      - name: Sandbox smoke test
        env:
          SMOKE_SANDBOX_BASE_URL: ${{ secrets.SANDBOX_BASE_URL }}
          SMOKE_SANDBOX_EMAIL_DOMAIN: ${{ secrets.SANDBOX_SMOKE_EMAIL_DOMAIN }}
        run: npm run smoke:sandbox
