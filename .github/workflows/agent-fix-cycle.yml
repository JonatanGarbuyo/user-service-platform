name: agent-fix-cycle

on:
  issue_comment:
    types: [created]

# One remote correction run per PR so duplicate /agent-fix-cycle commands
# cannot race on the same branch. Queued, never cancelled.
concurrency:
  group: agent-fix-cycle-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

# Least-privilege for correction-branch pushes and PR comments only. No
# production, deployment, Cloudflare, email-provider, or package secrets are
# available to these jobs.
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  run:
    # Pull requests only; plain issues are handled by agent-ticket.
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out trusted main for guard validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate /agent-fix-cycle trigger
        id: guard
        run: |
          set -euo pipefail
          COMMENT_BODY="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
          FIRST_LINE="$(printf '%s' "$COMMENT_BODY" | sed -n '/[^[:space:]]/{p;q;}')"
          # Exact fixed command only; comment text is never evaluated as shell,
          # arguments, filenames, refs, or prompts.
          if [ "$FIRST_LINE" != "/agent-fix-cycle" ]; then
            echo "No exact /agent-fix-cycle command on the first line; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATCHES="$(printf '%s' "$COMMENT_BODY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -xc -e '/agent-ticket' -e '/agent-fix-cycle' || true)"
          if [ "$MATCHES" != "1" ]; then
            echo "/agent-fix-cycle refused: ambiguous comment with multiple commands."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSOCIATION="$(jq -r '.comment.author_association // empty' "$GITHUB_EVENT_PATH")"
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "/agent-fix-cycle refused: unauthorized actor ($ASSOCIATION)."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          PR_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          PR_JSON="$(gh pr view "$PR_NUMBER" --json number,state,headRefName,baseRefName,headRefOid,isCrossRepository,url)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_BASE="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.headRefName')"
          PR_OID="$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')"
          PR_FORK="$(printf '%s' "$PR_JSON" | jq -r '.isCrossRepository')"
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "/agent-fix-cycle refused: PR #$PR_NUMBER is $PR_STATE, expected OPEN."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR #$PR_NUMBER is $PR_STATE, expected OPEN." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_FORK" = "true" ]; then
            echo "/agent-fix-cycle refused: fork PRs are not supported."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: fork PRs are not supported." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_BASE" != "main" ]; then
            echo "/agent-fix-cycle refused: PR base must be main, got $PR_BASE."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR base must be main, got $PR_BASE." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$PR_OID" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "/agent-fix-cycle refused: PR head SHA is missing or ambiguous."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR head is ambiguous; rerun once the PR HEAD is settled." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$PR_OID" >> "$GITHUB_OUTPUT"
          echo "branch=$PR_HEAD" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge command
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          HEAD="${{ steps.guard.outputs.head }}"
          gh pr comment "$PR_NUMBER" --body "Agent fix-cycle accepted for PR #$PR_NUMBER at HEAD $HEAD. Running address-review, gates, safe-push, and review:cycle on a GitHub-hosted runner; evidence will follow on this PR." || true

      - name: Check out PR head after authorization
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.branch }}
          fetch-depth: 0

      - name: Install pinned OpenCode
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version=1.18.30
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run address-review correction
        if: steps.guard.outputs.run == 'true'
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          opencode run --auto --command address-review "$PR_NUMBER"

      - name: Require clean correction or explicit no-code outcome
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "address-review left uncommitted changes; refusing to continue with a dirty worktree."
            exit 1
          fi
          echo "Worktree is clean after address-review."

      - name: Run repository quality gates
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check
          npm run typecheck
          npm run openapi:check
          npm run test
          npm run test:harness

      - name: Push correction through safe-push
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          npm run review:safe-push

      - name: Run review cycle
        if: steps.guard.outputs.run == 'true'
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          npm run review:cycle

      - name: Upload run evidence
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-fix-cycle-evidence-${{ github.event.issue.number }}
          path: .review-cycle/latest.json
          if-no-files-found: warn

      - name: Report terminal result
        if: steps.guard.outputs.run == 'true' && always()
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          HEAD="$(git rev-parse HEAD)"
          SUMMARY="Run summary: .review-cycle/latest.json (see workflow artifacts/run logs). Stopped at READY FOR FINAL ACCEPTANCE; never merges."
          if [ "${{ job.status }}" = "success" ]; then
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE READY FOR FINAL ACCEPTANCE. PR #$PR_NUMBER, reviewed HEAD $HEAD. $SUMMARY Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." || true
          else
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE BLOCKED for PR #$PR_NUMBER at HEAD $HEAD. $SUMMARY Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." || true
          fi
