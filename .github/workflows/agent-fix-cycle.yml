name: agent-fix-cycle

on:
  issue_comment:
    types: [created]

# One remote correction run per PR so duplicate /agent-fix-cycle commands
# cannot race on the same branch. Queued, never cancelled.
concurrency:
  group: agent-fix-cycle-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

# Least-privilege for correction-branch pushes and PR comments only. No
# production, deployment, Cloudflare, email-provider, or package secrets are
# available to these jobs.
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  run:
    # Pull requests only; plain issues are handled by agent-ticket.
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    # Backstop only: repository-owned worker bounds (ticket #31) terminate hung
    # workers well before this; the terminal step below still runs and
    # publishes the terminal status.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out trusted main for guard validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate /agent-fix-cycle trigger
        id: guard
        run: |
          set -euo pipefail
          COMMENT_BODY="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
          FIRST_LINE="$(printf '%s' "$COMMENT_BODY" | sed -n '/[^[:space:]]/{p;q;}')"
          # Exact fixed command only; comment text is never evaluated as shell,
          # arguments, filenames, refs, or prompts.
          if [ "$FIRST_LINE" != "/agent-fix-cycle" ]; then
            echo "No exact /agent-fix-cycle command on the first line; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATCHES="$(printf '%s' "$COMMENT_BODY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -xc -e '/agent-ticket' -e '/agent-fix-cycle' || true)"
          if [ "$MATCHES" != "1" ]; then
            echo "/agent-fix-cycle refused: ambiguous comment with multiple commands."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSOCIATION="$(jq -r '.comment.author_association // empty' "$GITHUB_EVENT_PATH")"
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "/agent-fix-cycle refused: unauthorized actor ($ASSOCIATION)."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          PR_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          PR_JSON="$(gh pr view "$PR_NUMBER" --json number,state,headRefName,baseRefName,headRefOid,isCrossRepository,url)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_BASE="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.headRefName')"
          PR_OID="$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')"
          PR_FORK="$(printf '%s' "$PR_JSON" | jq -r '.isCrossRepository')"
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "/agent-fix-cycle refused: PR #$PR_NUMBER is $PR_STATE, expected OPEN."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR #$PR_NUMBER is $PR_STATE, expected OPEN." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_FORK" = "true" ]; then
            echo "/agent-fix-cycle refused: fork PRs are not supported."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: fork PRs are not supported." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_BASE" != "main" ]; then
            echo "/agent-fix-cycle refused: PR base must be main, got $PR_BASE."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR base must be main, got $PR_BASE." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$PR_OID" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "/agent-fix-cycle refused: PR head SHA is missing or ambiguous."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR head is ambiguous; rerun once the PR HEAD is settled." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$PR_OID" >> "$GITHUB_OUTPUT"
          echo "branch=$PR_HEAD" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge command
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          HEAD="${{ steps.guard.outputs.head }}"
          gh pr comment "$PR_NUMBER" --body "Agent fix-cycle accepted for PR #$PR_NUMBER at HEAD $HEAD. Running address-review, gates, safe-push, and review:cycle on a GitHub-hosted runner; evidence will follow on this PR." || true

      - name: Check out PR head after authorization
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.branch }}
          fetch-depth: 0

      - name: Verify checked-out HEAD matches validated OID
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          EXPECTED="${{ steps.guard.outputs.head }}"
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "/agent-fix-cycle refused: PR #$PR_NUMBER advanced after validation (expected $EXPECTED, checked out $ACTUAL)."
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE REFUSED: PR #$PR_NUMBER advanced after validation (expected $EXPECTED, checked out $ACTUAL). Rerun /agent-fix-cycle once the PR HEAD is settled." || true
            exit 1
          fi
          echo "Checked-out HEAD $ACTUAL matches validated OID."

      - name: Create durable run status comment
        # One status surface per run (ticket #31): review:cycle PATCHes this
        # same comment as stages advance, and the terminal step PATCHes the
        # final outcome, so the current stage and terminal result are visible
        # from GitHub mobile/web without log polling. Bodies are deterministic
        # repository-owned metadata only — never transcripts or secrets.
        id: status
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          BRANCH="${{ steps.guard.outputs.branch }}"
          HEAD="${{ steps.guard.outputs.head }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(printf '<!-- agent-run-status -->\nTarget: PR #%s\nRun: %s\nBranch: %s\nHEAD: %s\nStage: validation\nCompleted: (none yet)\nStarted: %s\nUpdated: %s\nWorker: (none)\nOutcome: in progress' "$PR_NUMBER" "$RUN_URL" "$BRANCH" "$HEAD" "$STARTED" "$STARTED")"
          COMMENT_URL="$(gh pr comment "$PR_NUMBER" --body "$BODY")"
          COMMENT_ID="$(printf '%s' "$COMMENT_URL" | grep -oE 'issuecomment-[0-9]+' | grep -oE '[0-9]+' || true)"
          if [ -z "$COMMENT_ID" ]; then
            echo "Could not parse a status comment id from: $COMMENT_URL; continuing without stage updates."
            echo "comment-id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "comment-id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "AGENT_RUN_STATUS_COMMENT_ID=$COMMENT_ID" >> "$GITHUB_ENV"
          echo "AGENT_RUN_URL=$RUN_URL" >> "$GITHUB_ENV"

      - name: Install pinned OpenCode
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version=1.18.30
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run address-review correction
        # Bounded like the repository-owned address-review worker (ticket #31):
        # `timeout` terminates a hung correction run instead of leaving the
        # workflow at `still running` indefinitely. Exit 124 leaves a sentinel
        # that the terminal step maps to TIMEOUT (distinct from model, gate,
        # CI, or cancellation failures).
        if: steps.guard.outputs.run == 'true'
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          if timeout --signal=TERM --kill-after=60s 20m opencode run --auto --command address-review "$PR_NUMBER"; then
            echo "address-review completed within its bound."
          else
            CODE=$?
            if [ "$CODE" -eq 124 ]; then
              echo "address-review exceeded its 20m bound (TIMEOUT)."
              printf 'address-review timed out after 20m' > .address-review-timeout
              exit 1
            fi
            exit "$CODE"
          fi

      - name: Require clean correction or explicit no-code outcome
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "address-review left uncommitted changes; refusing to continue with a dirty worktree."
            exit 1
          fi
          echo "Worktree is clean after address-review."

      - name: Run repository quality gates
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check
          npm run typecheck
          npm run openapi:check
          npm run test
          npm run test:harness

      - name: Push correction through safe-push
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          npm run review:safe-push

      - name: Run review cycle
        if: steps.guard.outputs.run == 'true'
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          npm run review:cycle

      - name: Upload run evidence
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-fix-cycle-evidence-${{ github.event.issue.number }}
          path: .review-cycle/latest.json
          if-no-files-found: warn

      - name: Report terminal result
        # Publishes the terminal state for the run (ticket #31), including
        # workflow-level cancellation or timeout where scripts never ran. The
        # durable status comment is PATCHed to its terminal state, and one
        # concise terminal comment is posted so normal GitHub routing notifies
        # (PATCH edits alone do not notify). BLOCKED/NEEDS-DECISION/TIMEOUT
        # mention the owner so GitHub Mobile pushes; READY stays silent.
        if: steps.guard.outputs.run == 'true' && always()
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr }}"
          HEAD="$(git rev-parse HEAD)"
          BRANCH="$(git branch --show-current)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPDATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUTCOME="BLOCKED"
          STAGE="run"
          REASON="workflow did not reach READY"
          ACTION="Inspect the workflow logs and .review-cycle/latest.json, then rerun /agent-fix-cycle."
          STARTED="(see run log)"
          WORKER="(none)"
          if [ -f .address-review-timeout ]; then
            OUTCOME="TIMEOUT"
            STAGE="address-review"
            REASON="$(head -c 300 .address-review-timeout)"
            WORKER="address-review"
            ACTION="The address-review worker exceeded its bound; rerun once the runner is free."
          elif [ -f .review-cycle/latest.json ]; then
            SUMMARY_OUTCOME="$(jq -r '.outcome // empty' .review-cycle/latest.json)"
            SUMMARY_DETAIL="$(jq -r '.detail // empty' .review-cycle/latest.json | head -c 300)"
            SUMMARY_STAGE="$(jq -r '.stage // empty' .review-cycle/latest.json)"
            SUMMARY_STARTED="$(jq -r '.startedAt // empty' .review-cycle/latest.json)"
            SUMMARY_WORKER="$(jq -r '.timeout.worker // empty' .review-cycle/latest.json)"
            if [ -n "$SUMMARY_STAGE" ]; then
              STAGE="$SUMMARY_STAGE"
            fi
            if [ -n "$SUMMARY_STARTED" ]; then
              STARTED="$SUMMARY_STARTED"
            fi
            if [ -n "$SUMMARY_WORKER" ]; then
              WORKER="$SUMMARY_WORKER"
            fi
            case "$SUMMARY_OUTCOME" in
              READY)
                OUTCOME="READY"
                REASON="${SUMMARY_DETAIL:-ready for final acceptance}"
                ACTION=""
                ;;
              NEEDS-DECISION)
                OUTCOME="NEEDS-DECISION"
                REASON="${SUMMARY_DETAIL:-a human decision is required}"
                ACTION="A product, architecture, or contract decision is required before automation can continue."
                ;;
              TIMEOUT)
                OUTCOME="TIMEOUT"
                REASON="${SUMMARY_DETAIL:-a worker exceeded its bound}"
                ACTION="A worker exceeded its bound; rerun once the runner is free."
                ;;
              FATAL)
                OUTCOME="FATAL"
                REASON="${SUMMARY_DETAIL:-an unhandled worker failure}"
                ACTION="Inspect the workflow logs and .review-cycle/latest.json, then rerun /agent-fix-cycle."
                ;;
              *)
                OUTCOME="BLOCKED"
                REASON="${SUMMARY_DETAIL:-workflow did not reach READY}"
                ACTION="Inspect the workflow logs and .review-cycle/latest.json, then rerun /agent-fix-cycle."
                ;;
            esac
          elif [ "${{ job.status }}" = "success" ]; then
            OUTCOME="READY"
            STAGE="final acceptance-ready"
            REASON="ready for final acceptance"
            ACTION=""
          fi
          if [ "${{ job.status }}" = "cancelled" ]; then
            OUTCOME="BLOCKED"
            REASON="workflow cancelled"
            ACTION="Inspect the workflow state, then rerun /agent-fix-cycle."
            if [ -f .review-cycle/latest.json ]; then
              jq --arg ended "$UPDATED" --arg reason "$REASON" \
                '.outcome = "BLOCKED" | .detail = $reason | .endedAt = $ended' \
                .review-cycle/latest.json > .review-cycle/latest.json.tmp \
                && mv .review-cycle/latest.json.tmp .review-cycle/latest.json || true
            fi
          fi
          if [ ! -f .review-cycle/latest.json ]; then
            mkdir -p .review-cycle
            jq -n \
              --arg started "$STARTED" \
              --arg ended "$UPDATED" \
              --arg head "$HEAD" \
              --arg outcome "$OUTCOME" \
              --arg stage "$STAGE" \
              --arg reason "$REASON" \
              '{version: 1, command: "review:cycle", startedAt: (if $started == "(see run log)" then $ended else $started end), endedAt: $ended, durationMs: 0, reviewedHead: $head, stage: $stage, correctionCycles: 0, markerRetries: {standards: 0, spec: 0}, standardsAttempts: [], specAttempts: [], addressReviewAttempts: [], qualityGates: [], ci: {decision: "unknown", runs: []}, outcome: $outcome, detail: $reason}' \
              > .review-cycle/latest.json || true
          fi
          STATUS_BODY="<!-- agent-run-status -->
          Target: PR #$PR_NUMBER
          Run: $RUN_URL
          Branch: $BRANCH
          HEAD: $HEAD
          Stage: $STAGE
          Completed: (see run log)
          Started: $STARTED
          Updated: $UPDATED
          Worker: $WORKER
          Outcome: $OUTCOME — $REASON"
          COMMENT_ID="${{ steps.status.outputs.comment-id }}"
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --method PATCH -f body="$STATUS_BODY" || true
          fi
          if [ "$OUTCOME" = "BLOCKED" ] || [ "$OUTCOME" = "NEEDS-DECISION" ] || [ "$OUTCOME" = "TIMEOUT" ] || [ "$OUTCOME" = "FATAL" ]; then
            gh pr comment "$PR_NUMBER" --body "@JonatanGarbuyo $OUTCOME: $STAGE — $REASON. Action required: $ACTION PR #$PR_NUMBER, reviewed HEAD $HEAD. Workflow run: $RUN_URL." || true
          else
            gh pr comment "$PR_NUMBER" --body "AGENT-FIX-CYCLE READY FOR FINAL ACCEPTANCE. PR #$PR_NUMBER, reviewed HEAD $HEAD. Run summary: .review-cycle/latest.json (see workflow artifacts/run logs). Stopped at READY FOR FINAL ACCEPTANCE; never merges. Workflow run: $RUN_URL." || true
          fi
