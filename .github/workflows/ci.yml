name: ci

on:
  push:
    branches: ['**']
  pull_request: {}

jobs:
  gates:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI drift check
        run: npm run openapi:check

      - name: Workers runtime tests
        run: npm run test

      - name: Node harness tests
        run: npm run test:harness
