name: ci

on:
  push:
    branches: ['**']
  pull_request: {}

# Least-privilege for product CI: approving these runs must not expose
# write-capable repository credentials or secrets to product code/tests.
permissions:
  contents: read

jobs:
  gates:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI drift check
        run: npm run openapi:check

      - name: Workers runtime tests
        run: npm run test

      - name: Node harness tests
        run: npm run test:harness
