name: agent-ticket

on:
  issue_comment:
    types: [created]

# One remote run per issue so duplicate /agent-ticket commands cannot race on
# the same ticket branch. Queued, never cancelled.
concurrency:
  group: agent-ticket-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

# Least-privilege for ticket-branch pushes and PR/issue comments only. No
# production, deployment, or package secrets are available to these jobs.
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  run:
    # Issues only; PR comments are handled by agent-fix-cycle.
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    # Backstop only: repository-owned worker bounds (ticket #31) terminate hung
    # workers well before this; the terminal step below still runs and
    # publishes the terminal status.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate /agent-ticket trigger
        id: guard
        run: |
          set -euo pipefail
          COMMENT_BODY="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
          FIRST_LINE="$(printf '%s' "$COMMENT_BODY" | sed -n '/[^[:space:]]/{p;q;}')"
          # Exact fixed command only; comment text is never evaluated as shell,
          # arguments, filenames, refs, or prompts.
          if [ "$FIRST_LINE" != "/agent-ticket" ]; then
            echo "No exact /agent-ticket command on the first line; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATCHES="$(printf '%s' "$COMMENT_BODY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -xc -e '/agent-ticket' -e '/agent-fix-cycle' || true)"
          if [ "$MATCHES" != "1" ]; then
            echo "/agent-ticket refused: ambiguous comment with multiple commands."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSOCIATION="$(jq -r '.comment.author_association // empty' "$GITHUB_EVENT_PATH")"
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "/agent-ticket refused: unauthorized actor ($ASSOCIATION)."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state')"
          if [ "$ISSUE_STATE" != "OPEN" ]; then
            echo "/agent-ticket refused: issue #$ISSUE_NUMBER is $ISSUE_STATE, expected OPEN."
            gh issue comment "$ISSUE_NUMBER" --body "AGENT-TICKET REFUSED: issue #$ISSUE_NUMBER is $ISSUE_STATE, expected OPEN." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -xq 'ready-for-agent'; then
            echo "/agent-ticket refused: issue #$ISSUE_NUMBER lacks the ready-for-agent label."
            gh issue comment "$ISSUE_NUMBER" --body "AGENT-TICKET REFUSED: issue #$ISSUE_NUMBER is not an approved ready-for-agent ticket." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge command
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.guard.outputs.issue }}"
          gh issue comment "$ISSUE_NUMBER" --body "Agent ticket run accepted for issue #$ISSUE_NUMBER. Running \`npm run agent:ticket\` on a GitHub-hosted runner; evidence will follow on this issue." || true

      - name: Create durable run status comment
        # One status surface per run (ticket #31): scripts PATCH this same
        # comment as stages advance, and the terminal step PATCHes the final
        # outcome, so the current stage and terminal result are visible from
        # GitHub mobile/web without log polling. Bodies are deterministic
        # repository-owned metadata only — never transcripts or secrets.
        id: status
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.guard.outputs.issue }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(printf '<!-- agent-run-status -->\nTarget: issue #%s\nRun: %s\nBranch: (starting)\nHEAD: (starting)\nStage: validation\nCompleted: (none yet)\nStarted: %s\nUpdated: %s\nWorker: (none)\nOutcome: in progress' "$ISSUE_NUMBER" "$RUN_URL" "$STARTED" "$STARTED")"
          COMMENT_URL="$(gh issue comment "$ISSUE_NUMBER" --body "$BODY")"
          COMMENT_ID="$(printf '%s' "$COMMENT_URL" | grep -oE 'issuecomment-[0-9]+' | grep -oE '[0-9]+' || true)"
          if [ -z "$COMMENT_ID" ]; then
            echo "Could not parse a status comment id from: $COMMENT_URL; continuing without stage updates."
            echo "comment-id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "comment-id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "AGENT_RUN_STATUS_COMMENT_ID=$COMMENT_ID" >> "$GITHUB_ENV"
          echo "AGENT_RUN_URL=$RUN_URL" >> "$GITHUB_ENV"

      - name: Install pinned OpenCode
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version=1.18.30
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run agent ticket flow
        # Reuses npm run agent:ticket unchanged: branch -> /implement ->
        # quality gates -> safe push -> draft PR -> review:cycle, stopping at
        # READY FOR FINAL ACCEPTANCE. Never merges, deploys, or publishes.
        if: steps.guard.outputs.run == 'true'
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.guard.outputs.issue }}"
          npm run agent:ticket -- "$ISSUE_NUMBER"

      - name: Upload run evidence
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ticket-evidence-${{ github.event.issue.number }}
          path: .review-cycle/latest.json
          if-no-files-found: warn

      - name: Report terminal result
        # Publishes the terminal state for the run (ticket #31), including
        # workflow-level cancellation or timeout where scripts never ran. The
        # durable status comment is PATCHed to its terminal state, and one
        # concise terminal comment is posted so normal GitHub routing notifies
        # (PATCH edits alone do not notify). BLOCKED/NEEDS-DECISION/TIMEOUT
        # mention the owner so GitHub Mobile pushes; READY stays silent.
        # Outcome precedence keeps the worker-timeout distinction: the ticket
        # outcome record first (covers pre-review failures where review:cycle
        # never ran), then the review-cycle summary, then the job status.
        if: steps.guard.outputs.run == 'true' && always()
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.guard.outputs.issue }}"
          HEAD="$(git rev-parse HEAD)"
          BRANCH="$(git branch --show-current)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPDATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUTCOME="BLOCKED"
          STAGE="run"
          REASON="workflow did not reach READY"
          ACTION="Inspect the workflow logs and .review-cycle/latest.json, then rerun /agent-ticket."
          STARTED="(see run log)"
          WORKER="(none)"
          if [ -f .agent-ticket/outcome.json ]; then
            OUTCOME="$(jq -r '.outcome // empty' .agent-ticket/outcome.json)"
            STAGE="$(jq -r '.stage // empty' .agent-ticket/outcome.json)"
            REASON="$(jq -r '.reason // empty' .agent-ticket/outcome.json | head -c 300)"
            STARTED="$(jq -r '.startedAt // empty' .agent-ticket/outcome.json)"
            REC_ACTION="$(jq -r '.actionRequired // empty' .agent-ticket/outcome.json)"
            if [ -z "$OUTCOME" ]; then OUTCOME="BLOCKED"; fi
            if [ -z "$STAGE" ]; then STAGE="run"; fi
            if [ -z "$REASON" ]; then REASON="workflow did not reach READY"; fi
            if [ -z "$STARTED" ]; then STARTED="(see run log)"; fi
            if [ -n "$REC_ACTION" ]; then ACTION="$REC_ACTION"; fi
          elif [ -f .review-cycle/latest.json ]; then
            SUMMARY_OUTCOME="$(jq -r '.outcome // empty' .review-cycle/latest.json)"
            SUMMARY_DETAIL="$(jq -r '.detail // empty' .review-cycle/latest.json | head -c 300)"
            SUMMARY_STAGE="$(jq -r '.stage // empty' .review-cycle/latest.json)"
            SUMMARY_STARTED="$(jq -r '.startedAt // empty' .review-cycle/latest.json)"
            SUMMARY_WORKER="$(jq -r '.timeout.worker // empty' .review-cycle/latest.json)"
            if [ -n "$SUMMARY_STAGE" ]; then
              STAGE="$SUMMARY_STAGE"
            fi
            if [ -n "$SUMMARY_STARTED" ]; then
              STARTED="$SUMMARY_STARTED"
            fi
            if [ -n "$SUMMARY_WORKER" ]; then
              WORKER="$SUMMARY_WORKER"
            fi
            case "$SUMMARY_OUTCOME" in
              READY)
                OUTCOME="READY"
                REASON="${SUMMARY_DETAIL:-ready for final acceptance}"
                ACTION=""
                ;;
              NEEDS-DECISION)
                OUTCOME="NEEDS-DECISION"
                REASON="${SUMMARY_DETAIL:-a human decision is required}"
                ACTION="A product, architecture, or contract decision is required before automation can continue."
                ;;
              TIMEOUT)
                OUTCOME="TIMEOUT"
                REASON="${SUMMARY_DETAIL:-a worker exceeded its bound}"
                ACTION="A worker exceeded its bound; rerun once the runner is free."
                ;;
              *)
                OUTCOME="BLOCKED"
                REASON="${SUMMARY_DETAIL:-workflow did not reach READY}"
                ACTION="Inspect the workflow logs and .review-cycle/latest.json, then rerun /agent-ticket."
                ;;
            esac
          elif [ "${{ job.status }}" = "success" ]; then
            OUTCOME="READY"
            STAGE="final acceptance-ready"
            REASON="ready for final acceptance"
            ACTION=""
          fi
          if [ "${{ job.status }}" = "cancelled" ]; then
            OUTCOME="BLOCKED"
            REASON="workflow cancelled"
            ACTION="Inspect the workflow state, then rerun /agent-ticket."
          fi
          if [ ! -f .review-cycle/latest.json ]; then
            mkdir -p .review-cycle
            jq -n \
              --arg started "$STARTED" \
              --arg ended "$UPDATED" \
              --arg head "$HEAD" \
              --arg outcome "$OUTCOME" \
              --arg stage "$STAGE" \
              --arg reason "$REASON" \
              '{version: 1, command: "review:cycle", startedAt: (if $started == "(see run log)" then $ended else $started end), endedAt: $ended, durationMs: 0, reviewedHead: $head, stage: $stage, correctionCycles: 0, markerRetries: {standards: 0, spec: 0}, standardsAttempts: [], specAttempts: [], addressReviewAttempts: [], qualityGates: [], ci: {decision: "unknown", runs: []}, outcome: $outcome, detail: $reason}' \
              > .review-cycle/latest.json || true
          fi
          STATUS_BODY="<!-- agent-run-status -->
          Target: issue #$ISSUE_NUMBER
          Run: $RUN_URL
          Branch: $BRANCH
          HEAD: $HEAD
          Stage: $STAGE
          Completed: (see run log)
          Started: $STARTED
          Updated: $UPDATED
          Worker: $WORKER
          Outcome: $OUTCOME — $REASON"
          COMMENT_ID="${{ steps.status.outputs.comment-id }}"
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --method PATCH -f body="$STATUS_BODY" || true
          fi
          if [ "$OUTCOME" = "BLOCKED" ] || [ "$OUTCOME" = "NEEDS-DECISION" ] || [ "$OUTCOME" = "TIMEOUT" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "@JonatanGarbuyo $OUTCOME: $STAGE — $REASON. Action required: $ACTION Issue #$ISSUE_NUMBER, HEAD $HEAD. Workflow run: $RUN_URL." || true
          else
            gh issue comment "$ISSUE_NUMBER" --body "AGENT-TICKET READY FOR FINAL ACCEPTANCE. Issue #$ISSUE_NUMBER, HEAD $HEAD. Run summary: .review-cycle/latest.json (see workflow artifacts/run logs). Workflow run: $RUN_URL." || true
          fi
