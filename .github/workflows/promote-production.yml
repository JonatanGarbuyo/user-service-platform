name: promote-production

on:
  # Explicit human-controlled promotion only (ADR-0008, ticket #14). This
  # workflow intentionally has no push or pull_request trigger: merging to main
  # deploys sandbox via deploy-sandbox.yml and must never mutate production.
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Git SHA on main to promote to production'
        required: true
        type: string
      confirm_production:
        description: 'Type PROMOTE to confirm a production mutation'
        required: true
        type: string

# Least-privilege for production promotion: Cloudflare credentials arrive only
# through repository secrets and are never printed or committed.
permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: promote sandbox-verified commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Refuse unconfirmed promotion
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production }}" != "PROMOTE" ]; then
            echo "Refusing production promotion without explicit PROMOTE confirmation."
            exit 1
          fi

      - name: Check out the promoted commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify the promoted commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.source_commit }}" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations to production
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy Worker to production
        run: npx wrangler deploy --env production

      - name: Record production deployment
        run: |
          set -euo pipefail
          echo "source_commit=${{ inputs.source_commit }}"
          npx wrangler deployments list --env production
