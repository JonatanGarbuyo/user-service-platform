name: promote-production

on:
  # Explicit human-controlled promotion only (ADR-0008, ticket #14). This
  # workflow intentionally has no push or pull_request trigger: merging to main
  # deploys the configured sandbox target via deploy-sandbox.yml and must
  # never mutate production.
  #
  # Target-aware promotion (ticket #78): this workflow invokes the same
  # repository deploy boundary as a local operator
  # (`npm run deploy:production`) for the selected target. Production proceeds
  # only when `confirm_production` exactly equals the target production Worker
  # name (enforced by the deployer before any remote mutation); the workflow
  # itself refuses an empty confirmation first.
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Git SHA on main to promote to production'
        required: true
        type: string
      target:
        description: 'Deployment target key from deploy/targets.json'
        required: true
        default: 'rch-rugbychampagne'
        type: string
      confirm_production:
        description: 'Target production Worker name to confirm a production mutation'
        required: true
        type: string

# Least-privilege for production promotion: Cloudflare credentials arrive only
# through repository secrets and are never printed or committed.
permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: promote sandbox-verified commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Refuse unconfirmed promotion
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [ -z "$CONFIRM_PRODUCTION" ]; then
            echo "Refusing production promotion without an explicit Worker-name confirmation."
            exit 1
          fi

      - name: Check out the promoted commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify the promoted commit is on main
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Promote the target to production
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET: ${{ inputs.target }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          echo "source_commit=$SOURCE_COMMIT"
          npm run deploy:production -- --target "$TARGET" --confirm "$CONFIRM_PRODUCTION" --non-interactive
